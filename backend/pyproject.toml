[project]
name = "agentmarket-backend"
version = "0.1.0"
description = "AgentMarket — Multi-agent negotiation shopping assistant (BTK Hackathon 2026)"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.30",
    "google-genai>=0.5",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "websockets>=13",
]

[project.optional-dependencies]
# Live Trendyol scraping (search + reviews). Also run:
#   python -m playwright install chromium
scraping = [
    "playwright>=1.47",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]
agents = [
    "langgraph>=0.2",
    "langchain-google-genai>=2.0",
]
vector = [
    "chromadb>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
